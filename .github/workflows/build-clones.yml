name: Build Google Photos clones

# Sherbo's requirements (topic 76, 2026-10-22):
# - track mentalblank/GPhotos-Revanced for new versions
# - run on the 21st of each month + manual dispatch
# - build the clones from clones.json and put them in Releases for Obtainium
# - 05:06 order: the ONLY APK source is that repo's release assets (already
#   De-Vanced-patched); store the last processed upstream tag in state.json and
#   build only when upstream released something newer; focus the best
#   a12-supported version (minSdk <= 31 enforced in verify), overridable via
#   clones.json upstream.pinned_version.
# GATES CLEARED 2026-10-22: G1 halal ruling APPROVED by Sherbo (TG 2085);
# G2 hosting = his personal account (this repo). Signing secrets are set.

on:
  schedule:
    # 00:00 Africa/Cairo on the 21st: 21:00 UTC on the 20th in EEST (+3),
    # 22:00 UTC on the 20th in EET (+2). The cairo-gate step keeps exactly one.
    - cron: '0 21,22 20 * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if the latest upstream release is already processed'
        type: boolean
        default: false
      version:
        description: 'Pin a Photos version (an upstream release asset must carry it); empty = track upstream latest / clones.json pinned_version'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: build-clones
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.det.outputs.build }}
      version: ${{ steps.det.outputs.version }}
      matrix: ${{ steps.det.outputs.matrix }}
      asset_url: ${{ steps.det.outputs.asset_url }}
      upstream_tag: ${{ steps.det.outputs.upstream_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect upstream version + decide (Cairo 21st gate is inside the script)
        id: det
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force || false }}
          PIN_VERSION: ${{ inputs.version || '' }}
        run: python3 scripts/build_clones.py detect

  build:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.gate.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build one clone
        env:
          CLONE_LETTER: ${{ matrix.letter }}
          UPSTREAM_VERSION: ${{ needs.gate.outputs.version }}
          ASSET_URL: ${{ needs.gate.outputs.asset_url }}
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: python3 scripts/build_clones.py one
      - name: Verify the built APK
        env:
          CLONE_LETTER: ${{ matrix.letter }}
          UPSTREAM_VERSION: ${{ needs.gate.outputs.version }}
        run: python3 scripts/build_clones.py verify
      - uses: actions/upload-artifact@v4
        with:
          name: clone-${{ matrix.letter }}
          path: out/*.apk
          if-no-files-found: error

  cross-verify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          pattern: clone-*
          path: out
          merge-multiple: true
      - name: Cross-clone assertions (unique packages, unique authorities, identical spoof identity)
        run: python3 scripts/build_clones.py cross-verify
      - uses: actions/upload-artifact@v4
        with:
          name: all-clones
          path: out/**/*.apk
          if-no-files-found: error

  release:
    needs: [gate, cross-verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: all-clones
          path: out
      - name: Release (APKs + SHA256SUMS + meta.json) and bump state.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_VERSION: ${{ needs.gate.outputs.version }}
          UPSTREAM_TAG: ${{ needs.gate.outputs.upstream_tag }}
        run: python3 scripts/build_clones.py release
